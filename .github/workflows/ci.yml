# Offline CI: lint, tests, real test count, quick demo, doc drift, brand check and a full-history secret scan.
# No runtime dependencies. Actions are pinned to commit SHAs (Dependabot bumps them).
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.13", cache: pip }
      - name: Install (package with dev extras)
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests
        run: pytest -q
      - name: Test count (printed, not swallowed)
        run: python scripts/count_tests.py
      - name: Eval gate (safety probes must pass; writes outside the repo)
        run: entagents eval --out /tmp/results.json
      - name: results.json, agent pages, catalog JSON and README match a fresh run
        run: python scripts/render_docs.py --check
      - name: Small router results match a fresh run (synthetic data, simulated prices)
        run: python -m entagents.router.evaluate --out results/router.json --check
      - name: Brand check (hashed blocklist)
        run: python scripts/check_brands.py

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
