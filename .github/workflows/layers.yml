# Five-layer demo: golden prompt gate (schema, drift, cost) and a fresh benchmark that must match results/layers.json.
name: layers
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: layers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  layers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.13", cache: pip }
      - name: Install
        run: pip install -e ".[dev]"
      - name: Golden prompt regression gate
        run: python -m entagents.fourlayers gate
      - name: Five-layer tests (includes committed-results drift check)
        run: pytest -q tests/test_fourlayers.py
